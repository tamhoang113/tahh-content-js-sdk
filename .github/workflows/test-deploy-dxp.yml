name: Test Deploy to DXP Frontend Hosting

on:
  push:
    branches: [main]
    paths:
      - 'packages/optimizely-cms-cli/**'
      - 'packages/optimizely-cms-create-app/**'
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment (e.g. Integration)
        required: true
        default: Integration
      template:
        description: create-app template to use
        required: true
        default: nextjs-stride
        type: choice
        options:
          - nextjs-stride
          - nextjs-starter
          - nextjs-alloy

concurrency:
  group: dxp-deploy-${{ inputs.environment || 'Integration' }}
  cancel-in-progress: false

jobs:
  create-and-deploy:
    runs-on: ubuntu-latest
    env:
      DEPLOY_ENV: ${{ inputs.environment || 'Integration' }}
      TEMPLATE: ${{ inputs.template || 'nextjs-stride' }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install monorepo dependencies
        run: pnpm install

      - name: Build create-app and CLI
        run: pnpm --filter @optimizely/cms-create-app --filter @optimizely/cms-cli build

      - name: Create app from template
        run: node packages/optimizely-cms-create-app/bin/cms-create-app.js test-site --template ${{ env.TEMPLATE }} --pm npm --skip-install

      - name: Configure .env
        working-directory: test-site
        run: |
          cat > .env << ENVEOF
          OPTIMIZELY_CMS_URL=${{ vars.OPTIMIZELY_CMS_URL }}
          OPTIMIZELY_GRAPH_GATEWAY=${{ vars.OPTIMIZELY_GRAPH_GATEWAY }}
          OPTIMIZELY_GRAPH_SINGLE_KEY=${{ vars.OPTIMIZELY_GRAPH_SINGLE_KEY }}
          OPTIMIZELY_CMS_CLIENT_ID=${{ vars.OPTIMIZELY_CMS_CLIENT_ID }}
          OPTIMIZELY_CMS_CLIENT_SECRET=${{ secrets.OPTIMIZELY_CMS_CLIENT_SECRET }}
          OPTIMIZELY_CMS_API_URL=${{ vars.OPTIMIZELY_CMS_API_URL }}
          APPLICATION_HOST=${{ vars.APPLICATION_HOST }}
          OPTIMIZELY_DXP_PROJECT_ID=${{ secrets.OPTIMIZELY_DXP_PROJECT_ID }}
          OPTIMIZELY_DXP_CLIENT_KEY=${{ secrets.OPTIMIZELY_DXP_CLIENT_KEY }}
          OPTIMIZELY_DXP_CLIENT_SECRET=${{ secrets.OPTIMIZELY_DXP_CLIENT_SECRET }}
          OPTIMIZELY_DXP_API_URL=${{ secrets.OPTIMIZELY_DXP_API_URL }}
          ENVEOF

      - name: Install project dependencies
        working-directory: test-site
        run: npm install

      - name: Build project (fail-fast before upload)
        working-directory: test-site
        run: npm run build

      - name: Deploy to DXP
        working-directory: test-site
        run: node ../packages/optimizely-cms-cli/bin/run.js deploy --env "${{ env.DEPLOY_ENV }}" --yes --timeout 30
