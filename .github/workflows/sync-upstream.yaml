name: Sync upstream

on:
  schedule:
    - cron: '0 21 * * *'  # 4:00 AM Vietnam time (UTC+7)
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Add upstream remote
        run: git remote add upstream https://github.com/episerver/content-js-sdk.git || true

      - name: Fetch upstream
        run: git fetch upstream

      - name: Merge upstream/main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git merge upstream/main --no-edit || {
            echo "::warning::Merge conflict detected — manual resolution required"
            git merge --abort
            exit 1
          }

      - name: Verify fork-only QA code survived merge
        run: |
          if [ ! -f "_qa/helpers/sdk-api.ts" ] || [ ! -f "samples/nextjs-template/src/qa/_registry.ts" ]; then
            echo "::error::Fork-only QA files are missing after merge — aborting push to prevent data loss"
            exit 1
          fi
          echo "QA files verified ✅"

      - name: Push to fork
        run: git push origin main
