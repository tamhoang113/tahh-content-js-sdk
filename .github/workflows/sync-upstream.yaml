name: Sync upstream

on:
  schedule:
    - cron: '0 21 * * *'  # 4:00 AM Vietnam time (UTC+7)
  workflow_dispatch:       # manual trigger from GitHub UI

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add upstream and merge
        run: |
          git remote add upstream https://github.com/episerver/content-js-sdk.git
          git fetch upstream main
          git merge upstream/main --no-edit --allow-unrelated-histories || {
            echo "::warning::Merge conflict detected — manual resolution required"
            exit 1
          }

      - name: Push to fork
        run: git push origin main
