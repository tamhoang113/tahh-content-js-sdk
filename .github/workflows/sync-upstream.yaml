name: Sync upstream

on:
  schedule:
    - cron: '0 21 * * *'  # 4:00 AM Vietnam time (UTC+7)
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Sync upstream into fork
        shell: pwsh
        run: |
          ./scripts/sync-upstream.ps1 -Push

      - name: Create issue on merge conflict
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = `🔴 Upstream sync failed — merge conflict (${new Date().toISOString().slice(0,10)})`;
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'sync-conflict',
              per_page: 1,
            });
            if (existing.data.length > 0) {
              console.log('Open sync-conflict issue already exists, skipping');
              return;
            }
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body: [
                '## Upstream sync failed',
                '',
                'The auto-sync script could not safely resolve the current conflicts.',
                '',
                '**Steps to fix locally:**',
                '```bash',
                'cd D:\\github\\JS-SDK\\tahh-content-js-sdk',
                'pwsh -File .\\scripts\\sync-upstream.ps1',
                '# if the script stops, inspect the remaining conflicts',
                'git status',
                '```',
                '',
                `**Workflow run:** ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              ].join('\n'),
              labels: ['sync-conflict'],
            });
