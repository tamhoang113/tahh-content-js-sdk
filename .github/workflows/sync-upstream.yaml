name: Sync upstream

on:
  schedule:
    - cron: '0 21 * * *'  # 4:00 AM Vietnam time (UTC+7)
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Add upstream remote
        run: git remote add upstream https://github.com/episerver/content-js-sdk.git || true

      - name: Fetch upstream
        run: git fetch upstream

      - name: Merge upstream/main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git merge upstream/main --no-edit; then
            echo "Merge succeeded cleanly ✅"
          else
            CONFLICTED=$(git diff --name-only --diff-filter=U)
            echo "Conflicted files:"
            echo "$CONFLICTED"

            NON_LOCK=$(echo "$CONFLICTED" | grep -v '^pnpm-lock.yaml$' || true)
            if [ -n "$NON_LOCK" ]; then
              echo "::error::Conflicts in non-lockfile files — manual resolution required:"
              echo "$NON_LOCK"
              git merge --abort
              exit 1
            fi

            echo "Only pnpm-lock.yaml conflicted — auto-resolving"
            git checkout --theirs pnpm-lock.yaml
            git add pnpm-lock.yaml
          fi

      - name: Create issue on merge conflict
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = `🔴 Upstream sync failed — merge conflict (${new Date().toISOString().slice(0,10)})`;
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'sync-conflict',
              per_page: 1,
            });
            if (existing.data.length > 0) {
              console.log('Open sync-conflict issue already exists, skipping');
              return;
            }
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body: [
                '## Upstream sync failed',
                '',
                'Conflicts in non-lockfile files require manual resolution.',
                '',
                '**Steps to fix locally:**',
                '```bash',
                'cd D:\\github\\JS-SDK\\tahh-content-js-sdk',
                'git fetch upstream',
                'git merge upstream/main',
                '# resolve conflicts',
                'git add .',
                'git commit -m "Merge upstream/main - resolve conflicts"',
                'git push origin main',
                '```',
                '',
                `**Workflow run:** ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              ].join('\n'),
              labels: ['sync-conflict'],
            });

      - name: Verify fork-only QA code survived merge
        run: |
          if [ ! -f "_qa/helpers/sdk-api.ts" ] || [ ! -f "samples/nextjs-template/src/qa/_registry.ts" ]; then
            echo "::error::Fork-only QA files are missing after merge — aborting push to prevent data loss"
            exit 1
          fi
          echo "QA files verified ✅"

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Regenerate lockfile for _qa workspace
        run: |
          pnpm install --no-frozen-lockfile
          git add pnpm-lock.yaml
          git diff --cached --quiet pnpm-lock.yaml || git commit -m "chore: regenerate pnpm-lock.yaml after upstream sync"

      - name: Push to fork
        run: git push origin main
