# Copy of the template generated by create-app --ci github
# Adapted to run from test_deploy/my-nextjs-starter in the monorepo
# TEMPORARY — remove after testing CMS-56841
name: Deploy to Optimizely

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment as named in the DXP management portal (for example Test1, Test2 or Production1)
        required: true
        default: Production1

concurrency:
  group: optimizely-deploy-${{ inputs.environment || 'Production1' }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      DEPLOY_ENVIRONMENT: ${{ inputs.environment || 'Production1' }}
      OPTIMIZELY_DXP_PROJECT_ID: ${{ secrets.OPTIMIZELY_DXP_PROJECT_ID }}
      OPTIMIZELY_DXP_CLIENT_KEY: ${{ secrets.OPTIMIZELY_DXP_CLIENT_KEY }}
      OPTIMIZELY_DXP_CLIENT_SECRET: ${{ secrets.OPTIMIZELY_DXP_CLIENT_SECRET }}
      OPTIMIZELY_DXP_API_URL: ${{ secrets.OPTIMIZELY_DXP_API_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: ${{ hashFiles('test_deploy/my-nextjs-starter/yarn.lock') != '' && 'yarn' || 'npm' }}

      - name: Install dependencies
        working-directory: test_deploy/my-nextjs-starter
        run: if [ -f yarn.lock ]; then yarn install --frozen-lockfile; else npm ci; fi

      - name: Deploy
        working-directory: test_deploy/my-nextjs-starter
        run: npx optimizely-cms-cli deploy --env "$DEPLOY_ENVIRONMENT" --yes
